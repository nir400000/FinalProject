<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Baby Monitor</title>

  <!-- PWA -->
  <link rel="manifest" href="/media/manifest.json">
  <meta name="theme-color" content="#000000">

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="status">Connecting…</div>
  <img id="stream" />

  <script>
    const stream = document.getElementById("stream");
    const status = document.getElementById("status");

    const piIp = localStorage.getItem("pi_ip") || location.hostname;
    const url = `http://${piIp}:5001/video_feed`;

    stream.src = url;
    status.innerText = `Connected to ${piIp}`;
  </script>
</body>
</html>
